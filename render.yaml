# Render blueprint for the Oriki Homes demo site.
#
# The site is the single static page in web/ (no build step, no secrets: the
# intake webhook URL and Joy's public agent id are public by design, and Joy is
# protected by her site allowlist and her conversation caps).
#
# After the first deploy, add the Render URL to Joy's allowlist or "Talk to Joy"
# is refused on the live site:
#   ALLOWED_HOSTS=localhost,<your-render-host> python3 scripts/create-agent.py
services:
  - type: web
    name: oriki-homes
    runtime: static
    buildCommand: "echo 'static site: nothing to build'"
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: false
