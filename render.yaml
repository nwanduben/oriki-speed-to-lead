# Render Blueprint: the Oriki Homes demo page as a free static site.
# Render dashboard → New → Blueprint → pick this repo. No build step; web/ is served as-is.
services:
  - type: web
    name: oriki-homes
    runtime: static
    buildCommand: echo "static site, no build"
    staticPublishPath: ./web
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
